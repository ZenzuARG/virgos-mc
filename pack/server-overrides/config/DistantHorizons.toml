_version = 5

[server]
enableRealTimeUpdates = true
realTimeUpdateDistanceRadiusInChunks = 256
maxSyncOnLoadRequestDistance = 625
synchronizeOnLoad = true
maxGenerationRequestDistance = 625
generationRequestRateLimit = 16
syncOnLoadRateLimit = 16

[common.multiThreading]
numberOfThreads = 2
threadRunTimeRatio = "0.5"

[common.worldGenerator]
# Chunky owns missing-chunk generation. DH only serves the persisted shared
# cache here; disabling its own generator avoids unsupported-dimension injector
# failures while preserving cached LOD delivery.
generatorPlan = "DISABLED"
chunkGeneratorMode = "PRE_EXISTING_ONLY"
generationMaxChunkRadius = 625
showGenerationProgress = "DISABLED"

[client.advanced.autoUpdater]
enableAutoUpdater = false
enableSilentUpdates = false
