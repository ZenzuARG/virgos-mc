name: Build and publish Virgos-MC release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag to publish after successful checks (leave empty for build only)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select candidate and validate any publication tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python -B - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('pack/candidates/current.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', version)
          path = Path('pack/candidates') / version / 'release.json'
          metadata = json.loads(path.read_text())
          assert metadata['version'] == version
          tag = os.environ.get('REQUESTED_TAG') or (os.environ['REF_NAME'] if os.environ['REF_TYPE'] == 'tag' else '')
          if tag and tag != 'v' + version:
              raise SystemExit('Publication tag must match the selected candidate version')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('CANDIDATE_METADATA=' + path.as_posix() + '\n')
          PY

      - name: Cache locked client downloads
        uses: actions/cache@v5
        with:
          path: |
            .cache
          key: virgos-client-${{ hashFiles('pack/mods.lock.json', 'pack/client-runtime.lock.json', 'pack/dh-upstream.lock.json') }}

      - name: Fetch locked client and DH build dependencies
        run: |
          python -B scripts/test-fetch-locked-client-deps.py
          python -B scripts/fetch-locked-client-deps.py

      - name: Build Virgos Core and Codex reproducibly
        working-directory: dev/virgos-core
        run: bash gradlew check jar codexJar -PbuildEpoch=0 --no-daemon

      - name: Build pinned server-only TreeFeller and complete GPL sources
        run: |
          python -B scripts/build-tree-release.py \
            --cache-root "$RUNNER_TEMP/virgos-tree-cache" \
            --output "$RUNNER_TEMP/virgos-tree-release" --java-home "$(realpath "$JAVA_HOME")" \
            --allow-platform-variant

      - name: Build DH addon, patch and corresponding sources
        run: |
          python -B scripts/prepare-dh-release.py \
            --metadata "$CANDIDATE_METADATA" --cache-root "$GITHUB_WORKSPACE/.cache" \
            --inputs-dir "$RUNNER_TEMP/virgos-release-inputs" --java-home "$(realpath "$JAVA_HOME")" \
            --tree-artifacts "$RUNNER_TEMP/virgos-tree-release"

      - name: Build explicit candidate installer and Modrinth pack
        run: |
          python -B scripts/build-client-release.py \
            --release-metadata "$RUNNER_TEMP/virgos-release-inputs/release.json" \
            --custom-lock "$RUNNER_TEMP/virgos-release-inputs/custom-artifacts.lock.json" \
            --downloads "$GITHUB_WORKSPACE/.cache/pack/downloads" \
            --runtime-cache "$GITHUB_WORKSPACE/.cache" \
            --output "$RUNNER_TEMP/virgos-release-output"

      - name: Validate release artifacts and stage verified outputs
        run: |
          python -B - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          current = json.loads((temporary / 'virgos-release-inputs/release.json').read_text())
          output = temporary / 'virgos-release-output'
          report = json.loads((output / 'release.json').read_text())
          assert report['version'] == current['version'] and report['installerVersion'] == current['installer']
          for item in report['files']:
              path = output / item['name']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert not any('virgos_local_qa' in name or '/saves/' in name for name in archive.namelist())
                  for source in current['sourceFiles']:
                      assert hashlib.sha256(archive.read('sources/' + source['filename'])).hexdigest() == source['sha256']
                  if path.name.endswith('-instalar.zip'):
                      client = json.loads(archive.read('asistente/cliente.lock.json'))
                      assert client['clientRelease'] == current['clientRelease']
                      assert client['clientFingerprint'] == current['clientFingerprint']
                      assert len([item for item in client['files'] if item.get('bundled')]) == 3
          # Server-plugin assets remain outside client custom-mod roles.
          tree = temporary / 'virgos-tree-release'
          manifest = json.loads((tree / 'tree-release.json').read_text())
          assert manifest['schema'] == 1 and len(manifest['artifacts']) == 3
          for item in manifest['artifacts']:
              path = tree / item['filename']
              assert item['sides'] == ['server'] and path.stat().st_size == item['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
          destination = Path('dist'); destination.mkdir(exist_ok=True)
          for item in manifest['artifacts']:
              shutil.copyfile(tree / item['filename'], destination / item['filename'])
          for name in [*[item['name'] for item in report['files']], 'release.json']:
              shutil.copyfile(output / name, destination / name)
          PY

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" --title "Virgos-MC $RELEASE_TAG" --generate-notes
